services:
  order-postgres:
    image: postgres:15
    container_name: OrderPostgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: order
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d order"]
      interval: 2s
      timeout: 2s
      retries: 10
    ports:
      - "5434:5432"
    volumes:
      - OrderPostgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrations

    depends_on:
      order-postgres:
        condition: service_healthy

    command:
      - "-dir=/app/migrations"
      - "postgres"
      - "postgres://admin:admin@order-postgres:5432/order?sslmode=disable"
      - "up"

  order-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "50053:50053"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  OrderPostgres_data: