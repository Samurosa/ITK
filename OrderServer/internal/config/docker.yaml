jwt_secret_path: "/run/secrets/jwt_secret"
grpc:
  port: 50053
  timeout: 1m
spot:
  grpc_addr: "spot-server:50052"
postgres:
  link: "postgres://admin:admin@OrderPostgres:5432/order?sslmode=disable"
  max_retries: 10
  max_connections: 10
  min_connections: 2
redis:
  addr: "redis:6379"
  password: "admin"
  db: 0
  dial_timeout: 10s
  timeout: 5s
  ping_max_attempts: 5
  ping_retry_delay: 5s
kafka:
  brokers:
    - "kafka:9094"

  client_id: "order-service"

  topics:
    commands: "order.commands"
    events: "order.events"

  producer:
    required_acks: "all"
    idempotent: true
    compression: "snappy"
    batch_timeout: 5ms
    retry_max: 10

  consumer:
    group_id: "order-service"
    auto_commit: false
    start_offset: "earliest"

  security:
    protocol: "PLAINTEXT"
    sasl_mechanism: ""
    username: ""
    password: ""