services:
  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d db" ]
      interval: 2s
      timeout: 2s
      retries: 10
    ports:
      - "5433:5433"
    volumes:
      - db_data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./SpotServer/migrations/up:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://admin:admin@db:5433/db?sslmode=disable",
        "up"
      ]

  spot-server:
    build:
      context: SpotServer
      dockerfile: Dockerfile
    ports:
      - "50052:50052"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data: