services:
  spot-postgres:
    image: postgres:15
    container_name: SpotPostgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: spot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d spot"]
      interval: 2s
      timeout: 2s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - SpotPostgres_data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate
    depends_on:
      spot-postgres:
        condition: service_healthy
    volumes:
      - ./migrations/up:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://admin:admin@SpotPostgres:5432/spot?sslmode=disable",
        "up"
      ]

  spot-server:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "50052:50052"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  SpotPostgres_data: