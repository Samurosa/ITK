services:
  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d db" ]
      interval: 2s
      timeout: 2s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./UserApi/migrations/up:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://admin:admin@db:5432/db?sslmode=disable",
        "up"
      ]

  services:
    redis:
      image: redis:7-alpine
      container_name: redis
      ports:
        - "6379:6379"

  user-api:
    build:
      context: ./UserApi
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data: